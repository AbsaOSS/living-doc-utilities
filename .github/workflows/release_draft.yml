# Stage 1 of 2 of the release pipeline (manual dispatch).
#
# This workflow is the human review gate: it runs the quality gate, tags the
# commit, and creates a *draft* GitHub release with generated notes. Nothing
# irreversible happens here — no PyPI upload. Publishing the draft release from
# the Releases page triggers stage 2 (release.yml), which builds and uploads the
# package to PyPI.

name: Draft Release

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: 'New release tag; must match the pyproject.toml version. Syntax: "v[0-9]+.[0-9]+.[0-9]+".'
        required: true
      from-tag-name:
        description: 'Previous tag to compare against for the changelog (optional). Default: latest tag.'
        required: false

jobs:
  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest
    # Draft releases must be cut from master — the tag is created on this ref's
    # commit, so a dispatch from any other branch would tag a non-release commit.
    if: github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Verify tag matches pyproject.toml version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag-name }}
        run: |
          set -euo pipefail
          tag="$TAG_NAME"
          project_version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [[ "$tag" != "v${project_version}" ]]; then
            echo "::error::tag-name '$tag' does not match pyproject.toml version '$project_version' (expected 'v${project_version}')."
            exit 1
          fi
          echo "Tag '$tag' matches pyproject.toml version '$project_version'."

      - name: Install dependencies
        run: make install

      - name: Run quality gate
        run: make qa

      - name: Check tag format
        id: check-version-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.tag-name }}

      - name: Check previous tag (if provided)
        if: ${{ github.event.inputs.from-tag-name }}
        id: check-version-from-tag
        uses: AbsaOSS/version-tag-check@4145e48bf3f77a5afff2ec9afdd8afb6b53bce34
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github-repository: ${{ github.repository }}
          version-tag: ${{ github.event.inputs.from-tag-name }}
          should-exist: true

      - name: Generate Release Notes
        id: generate_release_notes
        uses: AbsaOSS/generate-release-notes@4592187ca123598c8f0bd6de06311c9f5cd8b773
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag-name: ${{ github.event.inputs.tag-name }}
          from-tag-name: ${{ github.event.inputs.from-tag-name }}
          chapters: |
            - {"title": "Entries to skip 🚫", "label": "duplicate"}
            - {"title": "Entries to skip 🚫", "label": "invalid"}
            - {"title": "Entries to skip 🚫", "label": "wontfix"}
            - {"title": "Entries to skip 🚫", "label": "no RN"}
            - {"title": "Breaking Changes 💥", "label": "breaking change"}
            - {"title": "Security updates 👮", "label": "security"}
            - {"title": "New Features 🎉", "label": "enhancement"}
            - {"title": "Bugfixes 🛠", "label": "bug"}
            - {"title": "Epics 📖", "label": "epic"}
            - {"title": "Infrastructure ⚙️", "label": "infrastructure"}
            - {"title": "Silent-live 🤫", "label": "silent live"}
            - {"title": "Documentation 📜", "label": "documentation"}
          duplicity-scope: 'none'
          warnings: true
          skip-release-notes-labels: "no RN,duplicate,invalid,wontfix"
          print-empty-chapters: false
          row-format-issue: '_{title}_ {developers} in {number}'
          row-format-pr: '_{title}_ {developers} in {number}'
          row-format-link-pr: true
          hierarchy: true

      - name: Create and push Git tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        env:
          TAG_NAME: ${{ github.event.inputs.tag-name }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const tag = process.env.TAG_NAME;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            console.log(`Tag created: ${tag}`);

      - name: Create Draft GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.event.inputs.tag-name }}
          body: ${{ steps.generate_release_notes.outputs.release-notes }}
          tag_name: ${{ github.event.inputs.tag-name }}
          draft: true
          prerelease: false
