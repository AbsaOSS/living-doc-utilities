name: "Static analysis & tests"

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Python Changes
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.changes.outputs.python_changed }}
      schema_changed: ${{ steps.changes.outputs.schema_changed }}
      authoring_docs_changed: ${{ steps.changes.outputs.authoring_docs_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether Python-related files changed
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename')
          else
            changed_files=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}")
          fi

          if echo "$changed_files" | grep -E '(\.py$|(^|/)requirements(-dev)?\.txt$|(^|/)pyproject\.toml$|^Makefile$|^scripts/)' > /dev/null; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -E '^living_doc_utilities/contracts/schemas/.*\.json$' > /dev/null; then
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -E '^(living_doc_utilities/authoring/(normalisation_cases\.yaml|docs_export\.py)|docs/authoring\.md|Makefile)$' > /dev/null; then
            echo "authoring_docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "authoring_docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Static checks give the same result on every interpreter, so they run once, on the
  # supported floor: syntax newer than 3.10 fails here.
  static-checks:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.task.name }} (Python 3.10)
    strategy:
      fail-fast: false
      matrix:
        task:
          - name: Black Format Check
            target: format-check
          - name: Pylint Analysis
            target: lint
          - name: Mypy Type Check
            target: types
          - name: Undeclared Imports (deptry)
            target: deptry
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Run ${{ matrix.task.name }}
        run: make ${{ matrix.task.target }}

  tests:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    name: Python Tests (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10 is the supported floor (see `requires-python` in pyproject.toml);
        # 3.14 is the newest supported interpreter.
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Run tests with coverage
        run: make coverage

  # Owner-side regeneration gate (docs/contracts.md, "Schema authoring rules"): a contract
  # model change with no regenerated schema must fail here, not downstream.
  schema-regeneration-check:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true' || needs.detect.outputs.schema_changed == 'true'
    runs-on: ubuntu-latest
    name: Schema Regeneration Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Regenerate contract schemas
        run: make schemas

      - name: Fail if the regenerated schemas differ from what is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- living_doc_utilities/contracts/schemas; then
            echo "::error::Generated schemas are out of date. Run 'make schemas' and commit the result."
            exit 1
          fi

  # Owner-side regeneration gate (docs/authoring.md, "Worked examples"): a
  # normalisation_cases.yaml change with no regenerated table must fail here, not downstream.
  docs-regeneration-check:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true' || needs.detect.outputs.authoring_docs_changed == 'true'
    runs-on: ubuntu-latest
    name: Authoring Docs Regeneration Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Regenerate the authoring docs worked-examples table
        run: make docs

      - name: Fail if the regenerated table differs from what is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/authoring.md; then
            echo "::error::docs/authoring.md's worked-examples table is out of date. Run 'make docs' and commit the result."
            exit 1
          fi

  # Packaging gate: the wheel a consumer installs has to work fresh. Builds it and imports every
  # module in three clean virtual environments (no extra / github / html), with `pip check` in
  # each. deptry cannot see which module needs which extra - this is the check that does.
  import-matrix:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    name: Import Matrix (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # The supported floor and the newest supported interpreter.
        python-version: [ "3.10", "3.14" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Build the wheel and run the import matrix
        run: make import-matrix

  # Single required status check. Always runs, so it always reports; skipped jobs
  # (no relevant changes) pass, failed or cancelled ones fail.
  qa-gate:
    needs: [ static-checks, tests, import-matrix, schema-regeneration-check, docs-regeneration-check ]
    if: always()
    runs-on: ubuntu-latest
    name: QA Gate
    steps:
      - name: Fail if any required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::a required job failed or was cancelled."
          exit 1
