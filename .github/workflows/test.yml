name: "Static analysis & tests"

on:
  push:
    branches: [ "master" ]
  pull_request:
    types: [ opened, synchronize, reopened ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect Python Changes
    runs-on: ubuntu-latest
    outputs:
      python_changed: ${{ steps.changes.outputs.python_changed }}
      schema_changed: ${{ steps.changes.outputs.schema_changed }}
      authoring_docs_changed: ${{ steps.changes.outputs.authoring_docs_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check whether Python-related files changed
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            changed_files=$(gh api \
              "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
              --paginate --jq '.[].filename')
          else
            changed_files=$(git diff --name-only "${{ github.sha }}~1" "${{ github.sha }}")
          fi

          if echo "$changed_files" | grep -E '(\.py$|(^|/)requirements\.txt$|(^|/)pyproject\.toml$)' > /dev/null; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -E '^living_doc_utilities/contracts/schemas/.*\.json$' > /dev/null; then
            echo "schema_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "schema_changed=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed_files" | grep -E '^(living_doc_utilities/authoring/(normalisation_cases\.yaml|docs_export\.py)|docs/authoring\.md|Makefile)$' > /dev/null; then
            echo "authoring_docs_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "authoring_docs_changed=false" >> "$GITHUB_OUTPUT"
          fi

  static-analysis-and-tests:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true'
    runs-on: ubuntu-latest
    name: ${{ matrix.task.name }} (Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # Python 3.10 is the supported floor (see `requires-python` in pyproject.toml);
        # 3.14 is the newest supported interpreter.
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        task:
          - name: Black Format Check
            target: format-check
          - name: Pylint Analysis
            target: lint
          - name: Mypy Type Check
            target: types
          - name: Python Tests
            target: coverage
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Run ${{ matrix.task.name }}
        run: make ${{ matrix.task.target }}

  # Owner-side regeneration gate (docs/contracts.md, "Schema authoring rules"): a contract
  # model change with no regenerated schema must fail here, not downstream.
  schema-regeneration-check:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true' || needs.detect.outputs.schema_changed == 'true'
    runs-on: ubuntu-latest
    name: Schema Regeneration Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Regenerate contract schemas
        run: make schemas

      - name: Fail if the regenerated schemas differ from what is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- living_doc_utilities/contracts/schemas; then
            echo "::error::Generated schemas are out of date. Run 'make schemas' and commit the result."
            exit 1
          fi

  # Owner-side regeneration gate (docs/authoring.md, "Worked examples"): a
  # normalisation_cases.yaml change with no regenerated table must fail here, not downstream.
  docs-regeneration-check:
    needs: detect
    if: needs.detect.outputs.python_changed == 'true' || needs.detect.outputs.authoring_docs_changed == 'true'
    runs-on: ubuntu-latest
    name: Authoring Docs Regeneration Check
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: make install

      - name: Regenerate the authoring docs worked-examples table
        run: make docs

      - name: Fail if the regenerated table differs from what is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- docs/authoring.md; then
            echo "::error::docs/authoring.md's worked-examples table is out of date. Run 'make docs' and commit the result."
            exit 1
          fi

  # Single required status check. Always runs, so it always reports; passes when
  # the matrix succeeded or was skipped (no Python changes), fails otherwise.
  qa-gate:
    needs: [ detect, static-analysis-and-tests, schema-regeneration-check, docs-regeneration-check ]
    if: always()
    runs-on: ubuntu-latest
    name: QA Gate
    steps:
      - name: Check matrix outcome
        shell: bash
        run: |
          set -euo pipefail
          changed="${{ needs.detect.outputs.python_changed }}"
          schema_changed="${{ needs.detect.outputs.schema_changed }}"
          authoring_docs_changed="${{ needs.detect.outputs.authoring_docs_changed }}"
          test_result="${{ needs.static-analysis-and-tests.result }}"
          schema_result="${{ needs.schema-regeneration-check.result }}"
          docs_result="${{ needs.docs-regeneration-check.result }}"
          echo "python_changed=$changed | schema_changed=$schema_changed | authoring_docs_changed=$authoring_docs_changed | static-analysis-and-tests=$test_result | schema-regeneration-check=$schema_result | docs-regeneration-check=$docs_result"
          if [[ "$changed" != "true" && "$schema_changed" != "true" && "$authoring_docs_changed" != "true" ]]; then
            echo "No Python-related, contract-schema, or authoring-docs changes — checks not required."
            exit 0
          fi
          if [[ "$changed" == "true" && "$test_result" != "success" ]]; then
            echo "::error::static analysis & tests did not pass (tests: $test_result)."
            exit 1
          fi
          if [[ "$schema_changed" == "true" || "$changed" == "true" ]] && [[ "$schema_result" != "success" ]]; then
            echo "::error::the schema regeneration check did not pass (schemas: $schema_result)."
            exit 1
          fi
          if [[ "$authoring_docs_changed" == "true" || "$changed" == "true" ]] && [[ "$docs_result" != "success" ]]; then
            echo "::error::the authoring docs regeneration check did not pass (docs: $docs_result)."
            exit 1
          fi
          exit 0
