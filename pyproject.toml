[project]
name = "living-doc-utilities"
version = "0.5.0"
description = "Core utility functions and data models shared across the living-doc ecosystem."
authors = [{ name="Miroslav Pojer", email="miroslav.pojer@absa.africa" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13,<3",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
# `living_doc_utilities.authoring.html_to_markdown` and
# `living_doc_utilities.authoring.url_policy.sanitize_html_fragment` need this to sanitise
# Azure DevOps rich-text HTML (docs/authoring.md, "URL policy"). Nothing else in the
# package imports it, and importing either module never requires it - only calling
# `sanitize_html_fragment` (directly, or via `convert_html_to_markdown`) does.
html = [
    "nh3>=0.2,<1",
]

[project.urls]
Repository = "https://github.com/AbsaOSS/living-doc-utilities"

[tool.setuptools.packages.find]
where = ["."]
include = ["living_doc_utilities*"]

[tool.setuptools.package-data]
"living_doc_utilities.contracts" = ["schemas/*.json"]

[tool.black]
line-length = 120
target-version = ['py310']
force-exclude = '''test'''

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
markers = [
    "integration: crosses more than one authoring module (normalize + ac_grammar together); still synthetic input, no I/O.",
]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = "tests"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
