[project]
name = "living-doc-utilities"
version = "0.5.0"
description = "Documentation contracts, authoring parsers and GitHub helpers shared across the living-doc ecosystem."
authors = [{ name="Miroslav Pojer", email="miroslav.pojer@absa.africa" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Core: everything `living_doc_utilities.contracts`, `.authoring` (except the HTML sanitiser),
# `.github.utils` and `.inputs` need. PyYAML is here because `authoring.docs_export` imports it
# at module level, and every module of the package has to import with no extra installed.
# Each lower bound is the lowest version the full test suite passes on (Python 3.10): pydantic
# 2.10.x fails `contracts.schema_export`, and nh3 below 0.2.17 has no `attribute_filter`.
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.20,<5",
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
# `living_doc_utilities.github.rate_limiter` and `living_doc_utilities.github.decorators`
# import PyGithub and requests at module level. `github.utils` and `inputs` do not.
github = [
    "PyGithub>=2,<3",
    "requests>=2.32,<3",
]
# `living_doc_utilities.authoring.html_to_markdown` and
# `living_doc_utilities.authoring.url_policy.sanitize_html_fragment` need this to sanitise
# Azure DevOps rich-text HTML (docs/authoring.md, "URL policy"). Nothing else in the
# package imports it, and importing either module never requires it - only calling
# `sanitize_html_fragment` (directly, or via `convert_html_to_markdown`) does. The converter's
# own parsing is the standard library's `html.parser`, so `nh3` is the only dependency.
html = [
    "nh3>=0.2.17,<1",
]

[project.urls]
Repository = "https://github.com/AbsaOSS/living-doc-utilities"

[tool.setuptools.packages.find]
where = ["."]
include = ["living_doc_utilities*"]

[tool.setuptools.package-data]
"living_doc_utilities.contracts" = ["schemas/*.json"]

[tool.black]
line-length = 120
target-version = ['py310']
force-exclude = '''^/tests/'''

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

# Undeclared-import gate (`make deptry`, no configuration): every deptry rule runs, and the two
# that matter most here are DEP001 (imported but not declared) and DEP004 (a development-only tool
# imported by the library's own code). deptry counts an extra as declared for the whole package, so
# which module may use which extra is enforced by the import matrix (`make import-matrix`), not by
# deptry. The group below is names only - the pinned versions live in requirements-dev.txt - and
# lets deptry tell a development-only tool (DEP004) from a library that was never declared.
[dependency-groups]
dev = [
    "black",
    "build",
    "deptry",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "ruff",
]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
markers = [
    "integration: crosses more than one authoring module (normalize + ac_grammar together); still synthetic input, no I/O.",
]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = "tests"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
