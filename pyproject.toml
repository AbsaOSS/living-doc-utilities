[project]
name = "living-doc-utilities"
version = "0.5.0"
description = "Documentation contracts, authoring parsers and GitHub helpers shared across the living-doc ecosystem."
authors = [{ name="Miroslav Pojer", email="miroslav.pojer@absa.africa" }]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
# Lower bounds are the lowest versions the full test suite passes on Python 3.10.
dependencies = [
    "pydantic>=2.11,<3",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
# rate_limiter.py/decorators.py import PyGithub/requests at module level; github.utils and inputs don't.
github = [
    "PyGithub>=2,<3",
    "requests>=2.32,<3",
]
# Only calling sanitize_html_fragment (via html_to_markdown or url_policy) needs nh3; importing either module doesn't.
html = [
    "nh3>=0.2.17,<1",
]

[project.urls]
Repository = "https://github.com/AbsaOSS/living-doc-utilities"

[tool.setuptools.packages.find]
where = ["."]
include = ["living_doc_utilities*"]

[tool.setuptools.package-data]
"living_doc_utilities.contracts" = ["schemas/*.json"]

[tool.black]
line-length = 120
target-version = ['py310']
force-exclude = '''^/tests/'''

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pylint.main]
# The supported floor; without it Pylint uses the running interpreter and its checks differ per Python.
py-version = "3.10"
# nh3 is a compiled extension with no statically-inferable members; Pylint must import it to see `clean` and `ALLOWED_TAGS`.
extension-pkg-allow-list = ["nh3"]

[tool.pylint.format]
# Same limit as Black and ruff.
max-line-length = 120

[tool.pylint.basic]
# Tiny functions (under 5 lines) need no docstring.
docstring-min-length = 5

# Names only (versions pin in requirements-dev.txt); extras are enforced by make import-matrix, not deptry.
[dependency-groups]
dev = [
    "black",
    "build",
    "deptry",
    "mypy",
    "pylint",
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "PyYAML",
    "ruff",
]

# The one accepted DEP004: `authoring/docs_export.py` is a repository script (`make docs`) and imports PyYAML only inside `_load_cases()`.
[tool.deptry.per_rule_ignores]
DEP004 = ["yaml"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.mypy]
check_untyped_defs = true
python_version = "3.10"
exclude = "tests"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"
